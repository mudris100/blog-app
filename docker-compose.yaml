---
services:
  blog-app:
    image: blog-app:v1
    container_name: blog-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/blogdb
      DB_USER: postgres
      DB_PASSWORD: 1234
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/actuator/health/liveness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data: